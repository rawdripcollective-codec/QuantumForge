name: Test & Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    node-version: '20'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check for security vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            *.log
          retention-days: 7

  smoke-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Smoke-test the server
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 2
          curl -s http://127.0.0.1:18789/health | grep -q '"status":"ok"' || exit 1
          curl -s http://127.0.0.1:18789/api/providers | grep -q '"active"' || exit 1
          curl -s -X POST http://127.0.0.1:18789/api/agent \
            -H "Content-Type: application/json" \
            -d '{"task":"Say hello"}' | grep -q '"summary"' || exit 1
          kill $SERVER_PID 2>/dev/null || true
          echo "Smoke test passed"
